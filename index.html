<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArpiSpace — Developer & Video Editor</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ======================================================
       🌸 ОСНОВА САЙТА
    ====================================================== */
    * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
    body { font-family: "Poppins", sans-serif; background: #fff; color: #333; overflow-x: hidden; }
    section { padding: 100px 10%; position: relative; }
    .btn { display: inline-block; background: #6c63ff; color: #fff; padding: 12px 28px; border-radius: 10px; font-weight: 600; transition: all 0.3s ease; margin: 5px; text-decoration: none; }
    .btn:hover { transform: scale(1.05); box-shadow: 0 8px 20px rgba(108,99,255,0.3); }
    h1, h2, h3 { color: #222; }

    /* ... Твой существующий CSS для сайта … */
    /* (hero, about, projects, contact, адаптивность и т.д.) */
    
    /* ======================================================
       💬 CHAT WIDGET IMESSAGE STYLE
    ====================================================== */
    #chat-button {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: #6c63ff;
      color: white;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 28px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      z-index: 9999;
    }

    #chat-window {
      position: fixed;
      right: 20px;
      bottom: 100px;
      width: 320px;
      height: 420px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      display: none;
      flex-direction: column;
      z-index: 9998;
    }

    #chat-header {
      background: #6c63ff;
      color: white;
      padding: 14px;
      font-size: 16px;
      border-radius: 20px 20px 0 0;
      text-align: center;
    }

    #chat-messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .message {
      max-width: 80%;
      padding: 8px 12px;
      margin: 5px 0;
      border-radius: 14px;
      font-size: 0.9rem;
    }

    .sent {
      align-self: flex-end;
      background: #6c63ff;
      color: white;
    }

    .received {
      align-self: flex-start;
      background: #f0f0f0;
      color: black;
    }

    #chat-input {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ddd;
    }

    #message-input {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 20px;
      padding: 8px;
    }

    #send-btn {
      margin-left: 8px;
      background: #6c63ff;
      color: white;
      border: none;
      padding: 10px 12px;
      border-radius: 50%;
      cursor: pointer;
    }
    /* ======================================================
   📱 MOBILE ADAPTATION
   Работает на всех устройствах до 768px
====================================================== */
@media (max-width: 768px) {

/* Базовые отступы */
section {
  padding: 60px 6%;
}

h1 { font-size: 1.9rem; }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.3rem; }

/* Кнопки */
.btn {
  padding: 10px 20px;
  font-size: 0.95rem;
}

/* Изображения всегда по ширине */
img {
  max-width: 100%;
  height: auto;
}

/* Контейнеры */
.container,
.content,
.row,
.box {
  width: 100%;
  flex-direction: column;
  text-align: center;
}

/* Убираем большие margin/columns */
.row > * {
  width: 100% !important;
  margin: 10px 0 !important;
}

/* Если есть геро-секция (hero) с картинкой */
.hero {
  display: flex;
  flex-direction: column-reverse;
  text-align: center;
  padding-top: 50px;
}
.hero img {
  width: 80%;
  margin: 0 auto;
}

/* Адаптация текста в hero */
.hero h1 {
  font-size: 2rem;
  margin-top: 20px;
}
.hero p {
  font-size: 1rem;
}

/* Блок About */
.about {
  text-align: center;
}
.about img {
  width: 70%;
  margin: 0 auto 20px;
}

/* Проекты */
.projects-grid {
  grid-template-columns: 1fr !important;
  gap: 20px;
}

/* Контакт */
.contact form {
  width: 100%;
}

/* ======================================================
   💬 CHAT WIDGET (мобильная адаптация)
====================================================== */

#chat-button {
  width: 50px;
  height: 50px;
  right: 15px;
  bottom: 15px;
  font-size: 24px;
}

#chat-window {
  width: 90%;
  height: 60%;
  bottom: 80px;
  right: 5%;
}

#chat-header {
  font-size: 14px;
  padding: 12px;
}

#message-input {
  font-size: 14px;
  padding: 7px 10px;
}

#send-btn {
  padding: 8px 10px;
}
}

/* ======================================================
 📱 Extra Small Phones (до 480px)
====================================================== */
@media (max-width: 480px) {

h1 { font-size: 1.7rem; }
h2 { font-size: 1.4rem; }

section {
  padding: 50px 5%;
}

/* Chat */
#chat-window {
  height: 65%;
}
}
  </style>
</head>
<body>

  <!-- === Твой существующий контент сайта === -->
  <!-- Hero, About, Projects, Contact, Footer и т.д. -->
  <!-- ... -->

  <!-- === CHAT WIDGET === -->
  <div id="chat-button">💬</div>

  <div id="chat-window">
    <div id="chat-header">Chat with Arpi</div>
    <div id="chat-messages"></div>
    <div id="chat-input">
      <input type="text" id="message-input" placeholder="Write a message..." />
      <button id="send-btn">➤</button>
    </div>
  </div>

  <!-- === Сценарий чата === -->
  <script>
    const WORKER_URL = "https://arpi.dlxxlk.workers.dev/";

    // Генерация уникального userId
    let userId = localStorage.getItem("chatUserId");
    if (!userId) {
      userId = "user" + Math.floor(Math.random() * 1000000000);
      localStorage.setItem("chatUserId", userId);
    }

    const chatBtn = document.getElementById("chat-button");
    const chatWindow = document.getElementById("chat-window");
    const messagesDiv = document.getElementById("chat-messages");
    const input = document.getElementById("message-input");
    const sendBtn = document.getElementById("send-btn");

    chatBtn.onclick = () => {
      chatWindow.style.display = chatWindow.style.display === "flex" ? "none" : "flex";
    };

    sendBtn.onclick = sendMessage;
    input.addEventListener("keypress", e => { if (e.key === "Enter") sendMessage(); });

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      appendMessage(text, "sent");
      input.value = "";

      await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userId, text })
      });
    }

    function appendMessage(text, type) {
      const div = document.createElement("div");
      div.classList.add("message", type === "sent" ? "sent" : "received");
      div.textContent = text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function pollLoop(){
      try {
        const res = await fetch(WORKER_URL + "?userId=" + encodeURIComponent(userId));
        if (res.ok) {
          const data = await res.json();
          if (data.messages && Array.isArray(data.messages)) {
            data.messages.forEach(m => {
              appendMessage(m.text, m.from === "user" ? "sent" : "received");
            });
          }
        }
      } catch (e) {
        console.error("Chat poll error:", e);
      }
      setTimeout(pollLoop, 2000);
    }

    pollLoop();
  </script>

</body>
</html>
