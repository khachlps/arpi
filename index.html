<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArpiSpace — Developer & Video Editor</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
/* ======================================================
   🌸 ОСНОВА САЙТА
   ====================================================== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  scroll-behavior: smooth;
}
body {
  font-family: "Poppins", sans-serif;
  background: #fff;
  color: #333;
  overflow-x: hidden;
}
section {
  padding: 100px 10%;
  position: relative;
}
.btn {
  display: inline-block;
  background: #6c63ff;
  color: #fff;
  padding: 12px 28px;
  border-radius: 10px;
  font-weight: 600;
  transition: all 0.3s ease;
  margin: 5px;
  text-decoration: none;
}
.btn:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 20px rgba(108,99,255,0.3);
}
h1, h2, h3 {
  color: #222;
}

/* ======================================================
   🌟 HERO
   ====================================================== */
.hero {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  text-align: left;
}
.hero-content {
  max-width: 600px;
}
.hero h1 {
  font-size: 2.8rem;
  font-weight: 700;
  line-height: 1.3;
  margin-bottom: 20px;
}
.hero p {
  font-size: 1.1rem;
  margin-bottom: 30px;
  color: #555;
}
.hero img {
  width: 380px;
  max-width: 100%;
  border-radius: 20px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.05);
}

/* ======================================================
   💬 CHAT WIDGET IMESSAGE STYLE
   ====================================================== */
#chat-button {
  position: fixed;
  right: 20px;
  bottom: 20px;
  background: #6c63ff;
  color: white;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 28px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.25);
  z-index: 9999;
}

#chat-window {
  position: fixed;
  right: 20px;
  bottom: 100px;
  width: 320px;
  height: 420px;
  background: #fff;
  border-radius: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  display: none;
  flex-direction: column;
  z-index: 9998;
}

#chat-header {
  background: #6c63ff;
  color: white;
  padding: 14px;
  font-size: 16px;
  border-radius: 20px 20px 0 0;
  text-align: center;
}

#chat-messages {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.message {
  max-width: 80%;
  padding: 8px 12px;
  margin: 5px 0;
  border-radius: 14px;
  font-size: 0.9rem;
}

.sent {
  align-self: flex-end;
  background: #6c63ff;
  color: white;
}

.received {
  align-self: flex-start;
  background: #f0f0f0;
  color: black;
}

#chat-input {
  display: flex;
  padding: 10px;
}

#message-input {
  flex: 1;
  border: 1px solid #ccc;
  border-radius: 20px;
  padding: 8px;
}

#send-btn {
  margin-left: 8px;
  background: #6c63ff;
  color: white;
  border: none;
  padding: 10px 12px;
  border-radius: 50%;
  cursor: pointer;
}
  </style>
</head>

<body>

<!-- Hero -->
<section class="hero" id="home">
  <div class="hero-content" data-animate>
    <h1>Hi, I’m Arpi — Developer, Website-Maker & Editor</h1>
    <p>I create modern apps, interfaces and videos that make business easier and life more beautiful.</p>
    <a href="#projects" class="btn">View my work</a>
    <a href="#contact" class="btn" style="background:#fff;color:#6c63ff;border:2px solid #6c63ff;">Contact me</a>
  </div>
  <img src="images/mee.jpg" alt="workspace" data-animate />
</section>

<!-- CHAT BUTTON + WINDOW -->
<div id="chat-button">💬</div>

<div id="chat-window">
  <div id="chat-header">Chat with Arpi</div>
  <div id="chat-messages"></div>
  <div id="chat-input">
    <input type="text" id="message-input" placeholder="Write a message..." />
    <button id="send-btn">➤</button>
  </div>
</div>

<!-- CHAT SCRIPT -->
<script>
  const WORKER_URL = "https://arpi.dlxxlk.workers.dev/"; // ← просто строка!
  
  document.getElementById("chat-button").onclick = () => {
    const chat = document.getElementById("chat-window");
    chat.style.display = chat.style.display === "flex" ? "none" : "flex";
  };
  
  document.getElementById("send-btn").onclick = sendMessage;
  document.getElementById("message-input").addEventListener("keypress", (e) => {
    if (e.key === "Enter") sendMessage();
  });
  
  async function sendMessage() {
    const input = document.getElementById("message-input");
    const text = input.value.trim();
    if (!text) return;
  
    addMessage(text, "sent");
  
    await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text })
    });
  
    input.value = "";
  }
  
  function addMessage(text, type) {
    const box = document.getElementById("chat-messages");
    const div = document.createElement("div");
    div.classList.add("message", type === "sent" ? "sent" : "received");
    div.textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }
  </script>

</body>
</html>
